  <h1>技术支持</h1>

  <div class="card">
    <h2>常见问题</h2>
    <p><strong>Q: 闹钟没有在预期时间响起？</strong></p>
    <p>A: 请检查是否已授权通知权限（系统设置 → 通知 → WorkdayAlarm），以及闹钟音量设置。</p>

    <p><strong>Q: 节假日判断不准确？</strong></p>
    <p>A: 本应用基于国务院发布的法定节假日安排。如有更新，应用会自动获取最新数据。</p>

    <p><strong>Q: 如何设置工作日闹钟？</strong></p>
    <p>A: 新建闹钟后，在重复设置中选择"工作日"，应用会智能避开周末和法定节假日。</p>
  </div>
